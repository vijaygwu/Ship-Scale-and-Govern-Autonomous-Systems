[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-production"
version = "1.0.0"
description = "Companion code for 'Agentic AI in Production' (Book 2 of the Agentic AI Series)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Dr. Vijay Raghavan" },
]
keywords = [
    "agents",
    "llm",
    "production",
    "identity",
    "secrets",
    "rate-limiting",
    "audit",
    "monitoring",
    "deployment",
    "error-handling",
    "testing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.110.0",
    "starlette>=0.36.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "PyJWT>=2.8.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "cachetools>=5.3.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "PyYAML>=6.0.1",
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",
]

# Optional backends. Install with: pip install -e ".[vault,aws,tracing]"
[project.optional-dependencies]
vault = ["hvac>=2.1.0"]
aws = ["boto3>=1.34.0"]
tracing = [
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-otlp>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
]
flags = ["launchdarkly-server-sdk>=9.4.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.92.0",
    "respx>=0.20.0",
    "vcrpy>=6.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
all = [
    "hvac>=2.1.0",
    "boto3>=1.34.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-otlp>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "launchdarkly-server-sdk>=9.4.0",
]

[project.urls]
Repository = "https://github.com/vijaygwu/Ship-Scale-and-Govern-Autonomous-Systems"

[tool.setuptools]
# Chapter code lives in per-chapter subdirectories rather than a single
# package. setuptools needs to be told there's no top-level package to
# auto-discover; the modules import via sys.path manipulation in the
# chapter examples and via the tests/ harness.
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["ch*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line-length is project-style, not a hard limit
    "E731",  # lambda assignments are intentional in some examples
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -v"
asyncio_mode = "auto"
