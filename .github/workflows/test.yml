name: Book 2 companion-code tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        working-directory: book-2/code
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest hypothesis httpx redis fastapi prometheus_client \
              pydantic pydantic-settings PyYAML structlog cryptography PyJWT \
              cachetools sqlalchemy starlette
          fi

      - name: Run pytest
        run: pytest book-2/code/tests -v

      - name: Verify chapter module imports
        working-directory: book-2/code
        run: |
          PYTHONPATH=ch01-enterprise-identity:ch03-rate-limits:ch04-audit-trails:ch05-deployment:ch06-monitoring:ch07-error-handling:ch08-testing \
            python -c "import identity, rate_limits, audit, deployment, monitoring, error_handling, testing; print('all chapter modules import')"

      - name: Lint with ruff (best effort)
        continue-on-error: true
        run: |
          pip install ruff || true
          if command -v ruff >/dev/null 2>&1; then
            ruff check book-2/code || true
          fi
